# SUT 1 pipeline. Stages:
#   check        warns when a pinned dependency has a newer release (never fails)
#   build-tcms   installs the dependencies listed in dependencies.txt (tcms-cli, TPDG)
#   test         runs the SUT 1 test cases; the run is kept as the runs artifact
#   validate     checks the run and the test cases against the tcms-schemas schemas
#   document     renders the Markdown and AsciiDoc documents of the run; kept as the
#                documents artifact
#   publish      appends the run to vv-tcms/ on the default branch
#   gate         fails the pipeline when a test case failed (last, so the run is published)
#
# Pipelines started by tcms-web for a traceability document (TCMS_DOC_REQUEST_ID set) run
# build-tcms and traceability-document only.

stages:
  - check
  - build-tcms
  - test
  - validate
  - document
  - publish
  - gate

variables:
  # Pinned dependency versions (the install script reads them; see dependencies.txt).
  # Change them here to use another tcms-cli or TPDG release.
  TCMS_CLI_VERSION: "v0.0.2-rc2_2026-10-30"
  TPDG_VERSION: "v0.1.0-rc.2"
  # tcms-schemas revision used to validate the records.
  TCMS_SCHEMAS_REF: requirement-list-schema
  TCMS_SCHEMAS_URL: https://gitlab.crypto.tii.ae/int/test-case-management-system/tcms-schemas.git
  TCMS_RUN_ID: "RUN-${CI_PIPELINE_ID}"
  TCMS_BUILD_ID: "${CI_COMMIT_SHORT_SHA}"
  TCMS_TESTER: "${GITLAB_USER_LOGIN}"
  GIT_DEPTH: "20"

# Warns about newer releases of the pinned dependencies. The warnings are printed for a reader
# or an agent to act on: "WARNING:" lines name the dependency and the variable to change.
version-check:
  stage: check
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null
  script:
    - scripts/check-versions.sh | tee version-check.txt
    - if grep -q '^WARNING:' version-check.txt; then echo "Dependency updates are available; see the WARNING lines above."; fi
  artifacts:
    when: always
    paths:
      - version-check.txt
    expire_in: 1 week

build-tcms:
  stage: build-tcms
  # rust:1.95 gives the glibc (2.39) the tcms-cli binaries need (see the test job).
  image: rust:1.95
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip zip jq curl ca-certificates python3 > /dev/null
  script:
    - scripts/install-deps.sh
  artifacts:
    paths:
      - tools/bin/
      - tools/tcms-cli/
      - tools/tpdg/
    expire_in: 1 week

test:
  stage: test
  # Same image as build-tcms: the tcms binaries need the newer glibc in it.
  image: rust:1.95
  needs: [build-tcms]
  except:
    variables:
      - $TCMS_DOC_REQUEST_ID
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq bash ca-certificates > /dev/null
  script:
    - scripts/validate-yaml-testcases.sh
    - scripts/run-tests.sh
  artifacts:
    # The run only: the documents are a separate artifact (document stage).
    when: always
    paths:
      - build/runs/
    expire_in: 1 week

validate:
  stage: validate
  image: python:3.12-slim
  needs:
    - job: test
      artifacts: true
  except:
    variables:
      - $TCMS_DOC_REQUEST_ID
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install -q --no-cache-dir uv
  script:
    # The tcms-schemas token is scoped to that project only, so it is passed to this clone alone.
    - TCMS_READ_TOKEN="$TCMS_SCHEMAS_READ_TOKEN" scripts/clone-repo.sh "$TCMS_SCHEMAS_URL" "$TCMS_SCHEMAS_REF" tcms-schemas-src
    # The validator runs in the environment tcms-schemas locks in its uv.lock.
    - uv sync --locked --project tcms-schemas-src
    # Every YAML data file is checked against the schema it names in its `schema:` key.
    - uv run --project tcms-schemas-src python scripts/validate-data-schemas.py tcms-schemas-src testcases/*.yml "build/runs/$TCMS_RUN_ID"/*.yaml
    # Requirements are checked in the same environment (it has PyYAML and jsonschema).
    - uv run --project tcms-schemas-src scripts/validate-requirements.sh tcms-schemas-src vv-tcms/requirements.json

# The single end-to-end check of the run: schemas, record consistency, documents and their
# verdicts (scripts/validate-chain.sh). It fails when any step of the chain fails.
validate-chain:
  stage: validate
  image: rust:1.95
  needs:
    - job: build-tcms
    - job: test
      artifacts: true
  except:
    variables:
      - $TCMS_DOC_REQUEST_ID
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq yq zip unzip git ca-certificates python3 python3-yaml python3-jsonschema > /dev/null
  script:
    - TCMS_READ_TOKEN="$TCMS_SCHEMAS_READ_TOKEN" scripts/clone-repo.sh "$TCMS_SCHEMAS_URL" "$TCMS_SCHEMAS_REF" tcms-schemas-src
    - scripts/validate-chain.sh "$TCMS_RUN_ID" tcms-schemas-src

# Renders the documents of the run (test cases, traceability matrix, outer document) in
# Markdown and AsciiDoc, checks them and keeps them as their own artifact.
document:
  stage: document
  image: rust:1.95
  needs:
    - job: build-tcms
    - job: test
      artifacts: true
  except:
    variables:
      - $TCMS_DOC_REQUEST_ID
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq yq curl unzip zip ca-certificates > /dev/null
  script:
    - TCMS_DOC_FROM_BUILD=1 scripts/traceability-document.sh
    - scripts/verify-documents.sh build/traceability/30_documentation_source
  artifacts:
    name: documents
    # The zip, and the same folder unzipped so the documents can be read in the GitLab web UI
    # (Browse artifacts) without downloading the zip.
    paths:
      - traceability-document.zip
      - build/traceability/30_documentation_source/
    expire_in: 1 week

# Appends the run to vv-tcms/ and pushes to the default branch. Runs only there, so merge
# request pipelines never write results. The push uses a project access token.
publish:
  stage: publish
  image: python:3.12-slim
  needs:
    - job: test
      artifacts: true
  rules:
    - if: '$TCMS_DOC_REQUEST_ID'
      when: never
    # Publish commits trigger a pipeline too (no [skip ci]); that one runs the tests but does
    # not publish again, so a run never starts a new run.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /^vv-tcms: publish/'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install -q --no-cache-dir pyyaml
  script:
    - git config user.name "sut-1 pipeline"
    - git config user.email "sut-1-pipeline@noreply.gitlab.crypto.tii.ae"
    # Publishing is redone on freshly fetched main for each attempt: another run may have
    # appended to index.jsonl since this job started, so rebasing would conflict.
    - |
      remote="https://oauth2:${SUT1_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      for attempt in 1 2 3; do
        git fetch -q "$remote" "${CI_DEFAULT_BRANCH}"
        git reset -q --hard FETCH_HEAD
        scripts/publish-results.sh "$TCMS_RUN_ID"
        git add vv-tcms
        git commit -q -m "vv-tcms: publish $TCMS_RUN_ID"
        if git push -q "$remote" "HEAD:${CI_DEFAULT_BRANCH}"; then
          exit 0
        fi
        echo "push rejected (attempt $attempt), retrying on fresh ${CI_DEFAULT_BRANCH}"
        sleep 5
      done
      echo "error: could not push the published run" >&2
      exit 1

# Fails the pipeline when any test case failed. It runs last so the run is still
# published with the failing verdicts.
gate:
  stage: gate
  image: debian:bookworm-slim
  needs:
    - job: test
      artifacts: true
  except:
    variables:
      - $TCMS_DOC_REQUEST_ID
  script:
    - |
      if grep -q 'verdict: fail' "build/runs/$TCMS_RUN_ID/test-run.yaml"; then
        echo "Run $TCMS_RUN_ID has failing test cases:"
        grep -B1 'verdict: fail' "build/runs/$TCMS_RUN_ID/test-run.yaml" || true
        exit 1
      fi
      echo "Run $TCMS_RUN_ID: all test cases passed"

# Traceability document for Verdict TCMS (tcms-web, ORCH-045). tcms-web starts a pipeline with
# the trigger API (POST /projects/455/trigger/pipeline) and the variables TCMS_DOC_REQUEST_ID,
# TCMS_TESTS_COMMIT and TCMS_CODE_COMMIT, waits for it and downloads the artifact of this job
# (GET /projects/455/jobs/<id>/artifacts, read_api). Runs only when TCMS_DOC_REQUEST_ID is set.
# The documents are built from the run in vv-tcms/ at TCMS_TESTS_COMMIT, with the tools from
# build-tcms (the TPDG credential is read there; see scripts/fetch-tpdg.sh).
traceability-document:
  stage: document
  image: rust:1.95
  needs: [build-tcms]
  rules:
    - if: '$TCMS_DOC_REQUEST_ID'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq yq curl unzip zip ca-certificates python3 python3-yaml python3-jsonschema > /dev/null
  script:
    # The requirement of each test case comes from the test case file, so the test cases are
    # checked against the tcms-schemas test-case schema before any document is rendered.
    - TCMS_READ_TOKEN="$TCMS_SCHEMAS_READ_TOKEN" scripts/clone-repo.sh "$TCMS_SCHEMAS_URL" "$TCMS_SCHEMAS_REF" tcms-schemas-src
    - python3 scripts/validate-data-schemas.py tcms-schemas-src testcases/*.yml
    # Every test case requirement must be an ID exported from StrictDoc or Jira.
    - scripts/validate-requirements.sh tcms-schemas-src vv-tcms/requirements.json
    - scripts/traceability-document.sh
    - scripts/verify-documents.sh build/traceability/30_documentation_source
  artifacts:
    name: traceability-document
    paths:
      - traceability-document.zip
    expire_in: 7 days
