# Integration config: SUT 1 with Jira Cloud (project SUT1). Decisions: vv-tcms/integration-config.md
# The secret is never stored here: auth.secret_ref names an environment variable.
type: integration_config
schema: tcms/integration-config.schema.json
product_id: sut-1
requirement_source: jira
systems:
  - name: jira
    type: jira_cloud
    base_url: https://garpisa8.atlassian.net
    auth:
      method: service_account_token
      secret_ref: TCMS_JIRA_TOKEN
    id_pattern: '^SUT1-[0-9]+$'
    url_template: '{base_url}/browse/{id}'
    url_pattern: '/browse/(?P<id>[A-Z][A-Z0-9]*-[0-9]+)$'
    project_keys: [SUT1]
    feature_issue_types: [Story]
    defect_issue_type: Bug
    severity_to_priority:
      critical: Highest
      major: High
      minor: Medium
      cosmetic: Low
    test_backend: none
    tcms_issue_types:
      test: Task
      link_type: Relates
    status_values:
      not_started: Not started
      in_progress: In progress
      passed: Passed
      failed: Failed
      blocked: Blocked
    milestone:
      target: fix_version
      release_on_plan_complete: false
    write_policy:
      feature_fields: false
      feature_transitions: false
      dedicated_issues: true
      comments: false
      defects: false
sync:
  trigger: cli
  identity: tcms-bot
  record_actor: true
